# Example app settings. Real location, in the config dir:
#   Linux:   ~/.config/mudular/mudular.yaml
#   macOS:   ~/Library/Application Support/mudular/mudular.yaml
#   Windows: %APPDATA%\mudular\config\mudular.yaml
# Entirely optional — with no file, or no keybinds section, quit defaults
# to ctrl+c.
keybinds:
  quit: ctrl+q
  # focus_next defaults to ctrl+tab. Terminals vary in whether they send
  # it at all; remap to alt+tab if yours does not. Alt+1..9 always jumps
  # straight to a session.
  focus_next: ctrl+tab
  cycle_layout: f3        # tabs <-> side-by-side splits
  toggle_channels: f4     # show/hide the channel column
  help: f1                # the in-client key/command listing
  toggle_timestamps: alt+t  # HH:MM:SS down the character panes

# How many commands each character remembers for Up/Down recall. Kept in
# memory only — a history file would be a plaintext record of everything
# typed at every prompt, passwords included.
history_size: 500

# Complete what you type from what the MUD just printed: type "look bull"
# with a bullywug in the room and Enter sends "look bullywug". Escape drops
# one line's suggestion; this turns it off for good.
autocomplete: true

# How many lines each pane's scrollback keeps, session panes and channel
# panes alike. PgUp/PgDn/Home/End scroll back through it; oldest lines drop
# first once the buffer is full.
scrollback_size: 10000

# Channel panes: matching lines are pulled out of the main scrollback into
# their own pane, so slow conversation stays readable under combat spam.
# Each `match` compiles to an ordinary route trigger, so a rule anywhere
# can also route a line explicitly with `route: comms`.
channels:
  - name: comms
    match:
      - '^\[gossip\]'
      - '^\w+ tells you'
    keep_in_main: false   # false (default) moves the line; true copies it
    timestamps: true
    persist: true         # true (default) — the pane survives a restart
    # session: kestrel    # pin to one character instead of aggregating

# What happens when another character's rules inject a command into a
# session. This is the install-wide default; a profile can override it —
# deliberately receiver-side, so only the character whose aliases would
# run can opt into running them.
cross_session:
  expand_aliases: false   # injected commands are sent verbatim
  max_hops: 1             # how far a chain of injections may travel
