# Release automation (release-plz). See .github/workflows/release-plz.yml.
#
# The division of labour with dist matters and is the reason for the first
# setting below: release-plz decides the version from the conventional-commit
# history, writes CHANGELOG.md, and tags. `dist` (dist-workspace.toml) reacts
# to that tag by building the five targets and their installers, and it is
# what creates the GitHub Release so the artifacts land on it. Two tools both
# creating a release would collide, so release-plz is told not to.
[workspace]
# dist creates the GitHub Release from the tag; release-plz must not.
git_release_enable = false

# Tag, so dist has something to react to.
git_tag_enable = true

# Already the default for a single-crate repo, and stated anyway because the
# whole chain hinges on it: release.yml only fires for tags matching
# `**[0-9]+.[0-9]+.[0-9]+*`, and v0.1.0/v0.2.0 set the convention. If this
# ever became a cargo workspace the default would silently change to
# `{{ package }}-v{{ version }}`, which is a shape dist reads as a package
# name rather than a plain version.
git_tag_name = "v{{ version }}"

# mudular is a binary, not a library anyone depends on from crates.io.
# Without this release-plz would try to `cargo publish` on every release.
publish = false

# Take the last released version from the git tags, not from crates.io.
#
# This is not optional here, and the first run proved it: release-plz's
# baseline is the cargo registry, so for a package that was never published
# it sees no previous release at all. It read Cargo.toml's 0.2.0 as the
# version still to be released, decided "next version is 0.2.0", found
# nothing to change and opened no PR -- the 71 commits and the v0.2.0 tag
# were both invisible to it. Reading tags instead is what makes an
# unpublished binary work, and it pairs with `git_tag_name` above, which is
# the template used to parse them.
#
# Mutually exclusive with `publish = true`; release-plz rejects the pair.
git_only = true

# The point of the exercise: CHANGELOG.md written from the commit history,
# grouped by conventional-commit type.
changelog_update = true

# Only open a release PR when something a player would notice has landed.
#
# Without this every commit qualifies, so a README tweak proposed a release of
# its own — v0.3.1 was very nearly a docs-only release. Commits that do not
# match still appear in the changelog of the next real release; they just no
# longer trigger one, which is the difference between "worth telling people
# about" and "happened".
#
# Known gap, and it is the honest one: a breaking change expressed *only* as
# a `BREAKING CHANGE:` footer on some other type will not trigger a release by
# itself. In practice such a change always arrives with a feat or a fix, and
# the `!?` here catches the `feat!:` / `fix!:` spelling.
release_commits = "^(feat|fix|perf)(\\(.*\\))?!?:"

# A `feat:` bumps the minor version even while this is 0.x.
#
# The default is the Cargo reading of semver, where `y` in `0.y.z` is the
# breaking position, so a non-breaking feature is only a patch: 71 commits
# adding the map pane, the party strip, comms panes and autocomplete came out
# as 0.2.1. That is defensible for a library, whose version answers "will
# this break my build". mudular is a terminal application with no public API
# for anyone to depend on, so its version is only ever telling a human how
# much changed, and a patch bump tells them the wrong thing.
#
# Breaking markers still outrank this: `feat!:` or a `BREAKING CHANGE:`
# trailer moves the minor position on its own.
features_always_increment_minor = true

# No `[[package]]` block for `test-support`: it is excluded from the
# workspace in Cargo.toml, so release-plz never sees it. A block here was
# tried first and was not enough — `release = false` skips the release, not
# the version determination that failed. See the comment in Cargo.toml.
