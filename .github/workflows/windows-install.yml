# What the README promises a Windows newcomer, run against the real release.
#
# The PowerShell installer is generated by dist, so what it does is not ours
# to change — only ours to describe accurately (#158). That makes the README's
# Windows section a claim about someone else's artifact, and the kind of claim
# that goes quietly stale: dist changes what it prints, and the instructions
# keep saying the old thing until a newcomer runs into it.
#
# So this checks the claim rather than the code. A failure here means the
# README needs updating, not that the client is broken.
name: Windows install

permissions:
  contents: read

on:
  # Only when this file is what changed. Everything here depends on a
  # published release and on the network, neither of which an ordinary PR
  # touches — a blip would fail a gate that has nothing to do with the diff
  # under review. When the workflow itself is the diff, that reasoning runs
  # the other way: a check nobody can run until it is merged is a check with
  # an unnoticed typo in it.
  pull_request:
    paths:
      - .github/workflows/windows-install.yml
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  install:
    name: Install from the latest release
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Windows PowerShell 5.1, not pwsh 7. The whole of #158 is that 5.1
      # defaults `$InformationPreference` to `SilentlyContinue` and 7 does
      # not, so testing this in 7 would test the shell nobody hit the bug in.
      - name: Run the installer the README tells people to run
        shell: powershell
        run: |
          $url = "https://github.com/millermatt/mudular/releases/latest/download/mudular-installer.ps1"
          $script = Join-Path $env:RUNNER_TEMP "mudular-installer.ps1"
          Invoke-WebRequest -Uri $url -OutFile $script

          # A child process with no profile, so the preferences are the stock
          # 5.1 ones a first-time player has rather than whatever this step
          # has accumulated.
          $out = & powershell.exe -NoProfile -File $script 2>&1 | Out-String

          if ($out.Trim() -ne "") {
            Write-Host "The installer produced output:"
            Write-Host $out
            Write-Host ""
            Write-Host "That is not a broken installer - it is a README that"
            Write-Host "now says the wrong thing. Its Windows section tells"
            Write-Host "people to expect silence (#158). Update it to match."
            exit 1
          }
          Write-Host "Installer finished silently, as the README says it will."

      # The three checks the README hands a player whose `mudular` is not
      # recognized. If one of them is wrong there, it is wrong here first.
      - name: Check what the README tells people to check
        shell: powershell
        run: |
          $bin = Join-Path $HOME ".cargo\bin"
          $exe = Join-Path $bin "mudular.exe"
          $onUserPath = [Environment]::GetEnvironmentVariable('Path','User') -split ';' -contains $bin

          "mudular.exe there: $(Test-Path $exe)"
          "in USER PATH     : $onUserPath"

          if (-not (Test-Path $exe)) {
            Write-Host "No exe: the install failed, and said nothing about it."
            exit 1
          }
          if (-not $onUserPath) {
            Write-Host "The exe is installed but the PATH edit did not stick."
            exit 1
          }

      # Installed is not the same as working, and a newcomer cannot tell the
      # difference between a binary that will not start and one that is not
      # on PATH - both are a prompt that does nothing useful.
      - name: Run it
        shell: powershell
        run: |
          & "$HOME\.cargo\bin\mudular.exe" --version
