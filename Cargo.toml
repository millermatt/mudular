[package]
name = "mudular"
version = "0.1.0"
edition = "2024"
description = "A modern, keyboard-centric terminal MUD client"
license = "MIT"

[dependencies]
ansi-to-tui = "7"
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6"
flate2 = "1"
futures = "0.3"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-input = { version = "0.11", default-features = false, features = ["crossterm"] }
webpki-roots = "0.26"

[dev-dependencies]
libc = "0.2.189"
rcgen = "0.14"
