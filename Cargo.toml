# `test-support` is a path dev-dependency, deliberately NOT a workspace
# member.
#
# Excluding it is what keeps the release machinery working. release-plz
# determines a next version for every *member* — `release = false` only
# skips the release itself, not the version calculation — and because
# `git_tag_name` is one workspace-wide template, it read the existing
# `v0.7.0` tag as this package's own last release, checked out that tag to
# diff against, and failed: at v0.7.0 the package did not exist yet
# ("Failed to find package test-support"). Two releases broke that way
# before this line existed.
#
# `exclude` gives cargo everything it needs — the path dev-dependency
# still resolves, and `cargo test` still runs it — while leaving the
# workspace with the single member release-plz has always seen.
[workspace]
exclude = ["test-support"]

[package]
name = "mudular"
version = "0.17.0"
edition = "2024"
description = "A modern, keyboard-centric terminal MUD client"
license = "GPL-3.0-or-later"
authors = ["Matt Miller"]
repository = "https://github.com/millermatt/mudular"
homepage = "https://github.com/millermatt/mudular"

[package.metadata.wix]
upgrade-guid = "858D8C4D-AFE3-4DED-B302-5FA86883CF1F"
path-guid = "E5C33D50-20BC-489D-ACFC-7671E451F4A1"
license = false
eula = false

[dependencies]
ansi-to-tui = "8"
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
flate2 = "1"
futures = "0.3"
# `vendored` statically links Lua 5.4 so the single-binary promise (§15)
# survives; `send` is required because a compiled `Engine` is moved into the
# session task and handed over `/reload`.
mlua = { version = "0.12", features = [
  "lua54",
  "vendored",
  "send",
], optional = true }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
# QuickJS, statically linked like Lua. `parallel` makes its runtime `Send`,
# which a compiled `Engine` must be. Off by default: a second engine proves
# the abstraction (§7.4), it is not something every build should carry.
rquickjs = { version = "0.12", features = ["parallel"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-input = { version = "0.15", default-features = false, features = ["crossterm"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
webpki-roots = "0.26"

# One native credential store per platform, so no OS pulls in another's
# backend and the static-binary promise of §15 survives (TAD §2.1).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4", default-features = false, features = [
  "v1",
  "zbus-secret-service-keyring-store",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", default-features = false, features = [
  "v1",
  "apple-native-keyring-store",
] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", default-features = false, features = [
  "v1",
  "windows-native-keyring-store",
] }

[dev-dependencies]
libc = "0.2.189"
test-support = { path = "test-support" }
rcgen = "0.14"

# Script engines are feature-gated so a build carries only the VMs it wants
# (TAD §7.4). Lua is on by default: it is the MUD community's lingua franca,
# so the stock binary is the one scripts are written against.
[features]
default = ["lua"]
lua = ["dep:mlua"]
js = ["dep:rquickjs"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
